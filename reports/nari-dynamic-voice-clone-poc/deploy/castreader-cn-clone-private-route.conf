log_format castreader_clone_alignment escape=json '{"time":"$time_iso8601","request_id":"$http_x_request_id","status":"$status","upstream":"$upstream_status","seconds":"$request_time","revision":"$upstream_http_x_voice_alignment_revision","mode":"$upstream_http_x_voice_alignment_mode"}';

server {
    listen 127.0.0.1:18890;
    server_name localhost;
    access_log off;
    client_max_body_size 8m;
    gzip off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_next_upstream off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;

    location = /v1/captioned-speech {
        access_log /var/log/nginx/castreader-clone-alignment.log castreader_clone_alignment;
        proxy_pass http://127.0.0.1:18891;
    }

    location / {
        proxy_pass http://127.0.0.1:18892;
    }
}
