[program:castreader-clone-tls]
command=/bin/bash /workspace/castreader-clone/deploy/run-clone-tls-origin.sh
directory=/workspace/castreader-clone
autostart=true
autorestart=unexpected
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/portal/castreader-clone-tls.log
stderr_logfile=/var/log/portal/castreader-clone-tls-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile_backups=2
priority=36
