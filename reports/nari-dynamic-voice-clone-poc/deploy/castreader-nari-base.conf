[program:castreader-nari-base]
command=/workspace/nari-qwen3-tts-clean/run-nari-base.sh
directory=/workspace/nari-qwen3-tts-clean
autostart=true
autorestart=unexpected
startsecs=25
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/portal/castreader-nari-base.log
stderr_logfile=/var/log/portal/castreader-nari-base-error.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=2
stderr_logfile_backups=2
priority=40
