[unix_http_server]
file=/root/autodl-tmp/castreader-alignment/run/supervisor.sock
chmod=0600

[supervisord]
logfile=/root/autodl-tmp/castreader-alignment/run/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=/root/autodl-tmp/castreader-alignment/run/supervisord.pid
childlogdir=/root/autodl-tmp/castreader-alignment/run
umask=0077

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///root/autodl-tmp/castreader-alignment/run/supervisor.sock

[program:castreader-clone-alignment]
command=/bin/bash /root/autodl-tmp/castreader-alignment/current/run-alignment-gateway.sh
directory=/root/autodl-tmp/castreader-alignment
autostart=true
autorestart=true
startsecs=10
startretries=3
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/root/autodl-tmp/castreader-alignment/run/alignment.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
