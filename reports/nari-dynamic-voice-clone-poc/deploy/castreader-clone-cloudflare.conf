[program:castreader-clone-cloudflare]
command=/opt/instance-tools/bin/cloudflared tunnel --no-autoupdate --protocol http2 --url http://127.0.0.1:8890
directory=/workspace/castreader-clone
autostart=true
autorestart=unexpected
startsecs=8
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/portal/castreader-clone-cloudflare.log
stderr_logfile=/var/log/portal/castreader-clone-cloudflare-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile_backups=2
priority=35
