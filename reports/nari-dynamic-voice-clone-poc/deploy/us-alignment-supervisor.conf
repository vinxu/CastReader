[program:castreader-clone-alignment]
command=/bin/bash /workspace/castreader-alignment/current/run-alignment-gateway.sh
directory=/workspace/castreader-alignment
autostart=true
autorestart=true
startsecs=10
startretries=10
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/workspace/castreader-alignment/run/alignment.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
priority=1000
